name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # assets/ is GBs of LFS objects; cache them to avoid re-downloading
      # (and burning LFS bandwidth) on every deploy. The object IDs are content
      # hashes, so this list also serves as a cheap fingerprint of assets/.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        run: git lfs pull

      - uses: jdx/mise-action@v3
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - name: Install dependencies
        run: make node_modules

      # Restored after `make node_modules`, otherwise the restored
      # node_modules/.astro would make `make` think dependencies are installed.
      # - src/generated-tiffs, public/files: prepare-assets.mjs output
      # - node_modules/.astro/assets: Astro's TIFF -> WebP conversion cache,
      #   whose entries are named by content hash, so stale ones are never reused.
      - uses: actions/cache@v5
        id: assets-cache
        with:
          path: |
            src/generated-tiffs
            public/files
            node_modules/.astro/assets
          key: assets-${{ hashFiles('.lfs-assets-id', 'pnpm-lock.yaml') }}
          restore-keys: assets-
      # prepare-assets.mjs skips files whose copy is newer than the source, but
      # checkout gives every source a fresh mtime. On an exact hit the copies are
      # known to match, so bump their mtimes; on a partial hit they're left
      # older, so everything is recopied.
      - name: Mark cached asset copies as fresh
        if: steps.assets-cache.outputs.cache-hit == 'true'
        run: find src/generated-tiffs public/files -type f -exec touch {} +

      - name: Build
        run: make dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
