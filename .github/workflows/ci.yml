name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4

      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: make check
